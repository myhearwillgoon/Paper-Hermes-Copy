[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-hermes"
version = "0.0.1"
description = "A small Hermes-Agent-style harness research testbed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mini-hermes = "mini_hermes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mini_hermes = ["workflows/*.yaml", "workflows/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
